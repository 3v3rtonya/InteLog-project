services:
  - type: web
    name: intelog-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: intelog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "True"
      - key: FRONTEND_URL
        value: https://intelog.vercel.app
      - key: UPLOAD_DIR
        value: uploads
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: intelog-db
    databaseName: intern_mis
    user: intelog_user
    plan: free
